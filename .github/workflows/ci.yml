name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run Unit Tests
      run: |
        python -m unittest discover -s tests -v

    - name: Run End-to-End CLI Verification
      run: |
        python -m evallake.cli eval examples/traces/agent_production_traces.jsonl --config examples/eval_rules.yaml --output-dir ./generated/ci-eval
        python -m evallake.cli dossier ./generated/ci-eval/evaluation_receipt.json --framework all --output-dir ./generated/ci-dossier
